<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fafaf8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0b0d" media="(prefers-color-scheme: dark)" />
    <script>
      // Apply the saved theme before first paint so the page never flashes the wrong palette.
      (function () {
        var dark;
        try {
          var saved = localStorage.getItem('adapt.theme');
          dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        } catch (e) {
          dark = matchMedia('(prefers-color-scheme: dark)').matches;
        }
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      })();
    </script>
    <meta
      name="description"
      content="ADAPT advertising decision workspace. Inspect evidence, review allocations, approve and track outcomes."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>ADAPT · Advertising intelligence</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
