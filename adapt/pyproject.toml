[project]
name = "adapt"
version = "0.1.0"
description = "ADAPT - Autonomous Decision & Allocation Platform for D2C (DataQuest 3.0)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "duckdb>=1.1",
    "pandas>=2.2",
    "pyarrow>=17",
    "numpy>=2.0",
    "scipy>=1.14",
    "statsmodels>=0.14",
    "ruptures>=1.1.9",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "structlog>=24.4",
    "rfc8785>=0.1.4",
    "kaggle>=1.6",
    "google-auth-oauthlib>=1.2",
    "lightgbm>=4.7.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.112",
    "ruff>=0.6",
    "import-linter>=2.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["backend", "world", "evalharness"]
testpaths = ["backend/tests", "world/tests", "integration"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["adapt", "world", "evalharness"]

[tool.importlinter]
root_packages = ["adapt", "world", "evalharness"]

[[tool.importlinter.contracts]]
name = "App never imports the world (truth isolation)"
type = "forbidden"
source_modules = ["adapt"]
forbidden_modules = ["world", "evalharness"]

[[tool.importlinter.contracts]]
name = "World never imports the app"
type = "forbidden"
source_modules = ["world"]
forbidden_modules = ["adapt", "evalharness"]
