name: Frontend
on:
  push:
    branches: [frontend, main]
    paths: ['adapt/web/**', '.github/workflows/frontend.yml']
  pull_request:
    paths: ['adapt/web/**', '.github/workflows/frontend.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: adapt/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: adapt/web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:e2e:api
