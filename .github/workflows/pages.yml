name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["adapt/web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: adapt/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: adapt/web/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Build labelled frontend demonstration
        run: npm run build
        env:
          VITE_BASE_PATH: /ADAPT/
          VITE_DATA_MODE: fixture
      - name: Support client-side routes on refresh
        run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: adapt/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
