name: ci
on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: adapt
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run ruff check .
      - name: import boundaries (truth isolation)
        run: PYTHONPATH=backend:world:evalharness uv run lint-imports
      - run: uv run pytest
